{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/tree_viewer.css') }}">
{% endblock %}


{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-md-12">
            <h1>Tree Viewer for Job: {{ job_id }}</h1>
            <div id="viewer-controls-container">
                {% include "partials/viewer_controls.html" %}
            </div>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col-md-12">
            <div id="tree-container" class="border rounded p-3" style="min-height: 600px; background-color: #fff;">
                <!-- Tree will be rendered here -->
                <div class="text-center text-muted mt-5">Loading tree...</div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}

<!-- Metadata for JS -->
<script>
    const JOB_ID = "{{ job_id }}";
</script>

<!-- Viewer Libraries -->
<!-- D3 (must come before phylotree and before any of your scripts that call d3) -->
<script src="https://cdn.jsdelivr.net/npm/d3@5/dist/d3.min.js"></script>

<!-- Phylotree (depends on D3) -->
<script src="https://cdn.jsdelivr.net/npm/phylotree@1/phylotree.js"></script>

<!-- viewer adapters -->
<script src="{{ url_for('static', filename='js/tree_viewer_phylotree.js') }}"></script>
<script src="{{ url_for('static', filename='js/tree_viewer_jsphylosvg.js') }}"></script>
<script src="{{ url_for('static', filename='js/tree_viewer_d3.js') }}"></script>
<script src="{{ url_for('static', filename='js/tree_viewer_controller.js') }}"></script>
<script src="{{ url_for('static', filename='js/tree_edit_actions.js') }}"></script>

{% endblock %}
