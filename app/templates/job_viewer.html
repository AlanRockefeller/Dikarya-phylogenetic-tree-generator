{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/tree_viewer.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/phylotree.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/phylotree-menus.css') }}">
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-md-12">
            <h1>Tree Viewer for Job: {{ job_id }}</h1>
            <div id="viewer-controls-container">
                {% include "partials/viewer_controls.html" %}
            </div>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col-md-12">
            <div id="tree-container" class="border rounded p-3" style="min-height: 600px; background-color: #fff;">
                <div class="text-center text-muted mt-5">Loading tree...</div>
            </div>
        </div>
    </div>
</div>

{% endblock %}



{% block scripts %}

<script>
    const JOB_ID = "{{ job_id }}";
</script>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
    window.d3v7 = window.d3; // Critical for your v2 renderer
</script>
<script src="https://cdn.jsdelivr.net/npm/lodash@4/lodash.min.js"></script>

<script src="{{ url_for('static', filename='js/phylotree.js') }}"></script>

<script src="{{ url_for('static', filename='js/tree_viewer_phylotree_v2.js') }}"></script>

<script src="{{ url_for('static', filename='js/tree_viewer_api.js') }}"></script>

<script src="{{ url_for('static', filename='js/tree_viewer_controller.js') }}"></script>

{% endblock %}
