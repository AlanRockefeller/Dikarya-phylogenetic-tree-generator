{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>My Jobs</h2>
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Job ID</th>
                    <th>Status</th>
                    <th>Input Type</th>
                    <th>Created At</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for job in jobs %}
                <tr>
                    <td>{{ job.id }}</td>
                    <td>
                        <span
                            class="badge bg-{{ 'success' if job.status == 'completed' else 'warning' if job.status == 'running' else 'secondary' }}">
                            {{ job.status }}
                        </span>
                    </td>
                    <td>{{ job.input_type }}</td>
                    <td>{{ job.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
                    <td>
                        <a href="{{ url_for('main.job_status', job_id=job.id) }}"
                            class="btn btn-sm btn-outline-primary">Status</a>
                        <a href="{{ url_for('main.job_viewer', job_id=job.id) }}"
                            class="btn btn-sm btn-outline-success">View Tree</a>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" class="text-center">No jobs found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
