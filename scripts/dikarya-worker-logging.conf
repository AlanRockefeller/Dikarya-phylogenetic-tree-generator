# Worker stdout/stderr -> a readable file, so routine worker output does not
# require journal access.
#
# The worker's application logging (RQ lifecycle, job reconciliation on boot,
# tracebacks outside a job context) previously existed only in the journal,
# which the `tree` account cannot read. Per-job detail already lands in
# var/jobs/<id>/logs/, but anything the worker logs outside a job was invisible.
#
# Install as root:
#   # Pre-create the file owned by the service user. systemd opens it with
#   # O_APPEND and keeps existing ownership; it must be dikarya-owned so that
#   # logrotate -- which runs in-process as dikarya via
#   # app/services/log_rotation.py -- can truncate it.
#   install -o dikarya -g dikarya -m 0644 /dev/null /var/www/dikarya/var/logs/worker.log
#   cp scripts/dikarya-worker-logging.conf \
#      /etc/systemd/system/dikarya-worker.service.d/logging.conf
#   systemctl daemon-reload
#   systemctl restart dikarya-worker      # check jobs-in-flight first
#
# Rotation is handled by ops/logrotate/dikarya, which now lists worker.log
# alongside access.log and error.log. copytruncate is the correct pairing for an
# O_APPEND fd: writes resume at the new end of file after truncation.
#
# Note this redirects application output away from the journal. systemd's own
# unit messages -- "Main process exited, code=killed, status=9/KILL", OOM kills,
# start failures -- still go to the journal only, which is what the
# dikarya-journal wrapper is for.

[Service]
StandardOutput=append:/var/www/dikarya/var/logs/worker.log
StandardError=append:/var/www/dikarya/var/logs/worker.log
