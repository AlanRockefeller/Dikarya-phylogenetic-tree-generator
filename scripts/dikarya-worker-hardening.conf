# systemd hardening drop-in for dikarya-worker.service
#
# Install as root:
#   mkdir -p /etc/systemd/system/dikarya-worker.service.d
#   cp scripts/dikarya-worker-hardening.conf \
#      /etc/systemd/system/dikarya-worker.service.d/hardening.conf
#   systemctl daemon-reload
#   flask jobs-in-flight      # must report nothing before the restart
#   systemctl restart dikarya-worker
#
# Verify afterwards with:
#   systemd-analyze security dikarya-worker.service
#
# This is a drop-in, so it layers on top of the existing unit without editing
# it. To back out, delete the file and daemon-reload.

[Service]

# --- Privilege ---------------------------------------------------------
# The worker spawns MAFFT, trimAl, FastTree, RAxML-NG and IQ-TREE on user
# supplied alignments. These are research-grade C/C++ parsers with no CVE
# history because nobody has looked, not because they are known clean, so the
# blast radius of a memory-safety bug in one of them is what these settings
# bound.
NoNewPrivileges=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
RemoveIPC=yes

# --- Filesystem --------------------------------------------------------
# ProtectSystem=full makes /usr, /boot and /etc read-only while leaving /var
# writable, which is what the job directories under /var/www/dikarya/var need.
# Tightening to ProtectSystem=strict is the better end state but requires
# enumerating ReadWritePaths (at minimum /var/www/dikarya/var and
# /var/www/dikarya/cache) -- do that as a separate, tested change.
ProtectSystem=full

# ProtectHome MUST be read-only here, NOT yes.
# TRIMAL_BINARY in /etc/dikarya/dikarya.environment.live points at
# /home/tree/miniforge3/bin/trimal, and trimAl is the default trimmer
# (DEFAULT_TRIMMING_METHOD=trimal_gappy). ProtectHome=yes hides /home and every
# job that trims would fail. Relocating trimal to /usr/local/bin would let this
# become ProtectHome=yes -- worth doing, since the worker currently executes a
# binary out of an interactive user's home directory.
ProtectHome=read-only

# Private /tmp. Job data moves between web and worker through
# /var/www/dikarya/var/jobs, never /tmp, so isolating it is safe. MAFFT's
# scratch files land in the private namespace and are cleaned up with it.
PrivateTmp=yes

ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible

# --- Resource ceilings -------------------------------------------------
# The host has 15 GB of RAM and no swap. Without a cgroup ceiling a runaway
# alignment gets the machine OOM killed and the kernel chooses the victim,
# which is as likely to be Gunicorn or Redis as the tool at fault.
#
# This complements, and does not replace, the per-process rlimits applied in
# app/services/subprocess_utils.py (SUBPROCESS_MEMORY_LIMIT_MB, default 9 GB).
# Those cap one tool; this caps the worker and all of its children together.
MemoryHigh=8G
MemoryMax=10G
TasksMax=256

# --- Optional, test before enabling ------------------------------------
# A syscall allowlist is the single biggest additional win against an exploited
# parser, but it needs a real job run to validate. Enable, submit a job of each
# tree method, and check the journal for "Operation not permitted" before
# trusting it.
#SystemCallFilter=@system-service
#SystemCallErrorNumber=EPERM
#SystemCallArchitectures=native
#RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
#MemoryDenyWriteExecute=yes
