# Memory ceiling for the bulk worker. MUST be a drop-in, not a unit setting.
#
# The bulk unit originally carried MemoryHigh=4G / MemoryMax=5G in [Service]
# itself, on the assumption that "a later drop-in wins" meant the unit's own
# value applied. It does not: systemd applies the unit file FIRST and then each
# drop-in in lexicographic order, so hardening.conf -- copied from
# dikarya-worker and sized for a single worker at 8G/10G -- silently replaced
# both. Verified on 2026-09-05: with the values in the unit, systemctl showed
# MemoryHigh=8G / MemoryMax=10G.
#
# That mattered because the host has 15 GB and NO SWAP. An 10G bulk ceiling
# beside the interactive worker's 8G allows 18 GB of hard ceiling against 15 GB
# of RAM, i.e. an OOM kill mid-RAxML rather than the reclaim-and-throttle
# behaviour MemoryHigh is there to provide.
#
# The filename sorts after hardening.conf and umask.conf, which is the whole
# point -- keep the "zz-" prefix if you rename it.
#
# Install as root:
#   cp scripts/dikarya-worker-bulk-memory.conf \
#      /etc/systemd/system/dikarya-worker-bulk.service.d/zz-memory.conf
#   systemctl daemon-reload
#   redis-cli ZCARD rq:wip:phylo_bulk     # must print 0 before restarting
#   systemctl restart dikarya-worker-bulk
#
# Verify (must print 4G/5G, not 8G/10G):
#   systemctl show dikarya-worker-bulk -p MemoryHigh -p MemoryMax

[Service]
MemoryHigh=4G
MemoryMax=5G
