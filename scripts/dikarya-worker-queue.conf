# Pin the original worker to the interactive queue.
#
# Before this drop-in, dikarya-worker served BOTH queues from one process
# (app/workers/worker_monitor.py hardcoded [phylo_high, phylo_bulk]). RQ drains
# a higher-priority queue first, but priority only decides what runs NEXT -- it
# cannot preempt. With a single slot, one long job blocked every short job
# behind it no matter which queue each was on, so the two-queue design bought
# nothing.
#
# On 2026-09-03 that put 12 jobs behind one 8-hour MAFFT run whose input was a
# set of complete phage genomes. Measured across 296 completed jobs, the median
# job is 38s and 76% finish inside a minute, so those 12 represented about ten
# minutes of real work.
#
# This drop-in plus dikarya-worker-bulk.service gives each queue its own
# process. A slow job now occupies only the slow lane.
#
# Install as root:
#   mkdir -p /etc/systemd/system/dikarya-worker.service.d
#   cp scripts/dikarya-worker-queue.conf \
#      /etc/systemd/system/dikarya-worker.service.d/queue.conf
#   systemctl daemon-reload
#   # Check for in-flight jobs first -- a restart SIGKILLs the work horse:
#   redis-cli ZCARD rq:wip:phylo_high    # must print 0
#   systemctl restart dikarya-worker
#
# To back out, delete the file and daemon-reload; the worker returns to serving
# both queues, which is still correct behaviour on its own.

[Service]
# ExecStart must be cleared before being reset in a drop-in.
ExecStart=
ExecStart=/var/www/dikarya/.venv/bin/flask run-worker --queues phylo_high

# Both cores. This worker runs the jobs a human is actively waiting on.
Environment=DIKARYA_WORKER_THREADS=2

# Silence the OpenMP runtime's OMPT tool probe. IQ-TREE is built against LLVM
# OpenMP, which dlopen()s libarcher.so (the data-race detector) at startup and
# prints the failure to stderr when it is not installed -- landing a bogus
# "cannot open shared object file" line in tree_builder.log directly beneath a
# successful "Exit code: 0". Nothing loads the tool and nothing wants it.
Environment=OMP_TOOL=disabled

# --- Memory ------------------------------------------------------------
# The host has 15 GB and NO SWAP, so the two workers' ceilings have to be
# considered together. The base unit's hardening drop-in sets MemoryHigh=8G /
# MemoryMax=10G, which was sized for a single worker; leaving that unchanged
# while adding a 5 GB bulk worker allows 15 GB of hard ceiling against 15 GB of
# RAM. MemoryHigh throttles by reclaiming well before MemoryMax is reached, so
# this is not an immediate OOM, but it removes the margin. Lower the
# interactive worker to match the pair.
MemoryHigh=6G
MemoryMax=8G
