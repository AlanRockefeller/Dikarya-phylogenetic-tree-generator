# Group-writable job artifacts, so an account in the `dikarya` group (e.g.
# `tree`) can run maintenance scripts against var/jobs directly instead of
# going through `sudo -u dikarya`.
#
# Ownership and mode are two separate problems and BOTH have to be solved:
#
#   * chmod g+w fixes the files that exist today. It does nothing for the ones
#     the web and worker processes create tomorrow.
#   * Those processes run with systemd's default umask 0022, which creates
#     files 0644 and directories 0755 -- no group write. UMask=0002 makes them
#     0664 / 0775 instead. Directories under var/jobs carry setgid (chmod g+s),
#     so a new job directory also inherits group `dikarya` rather than the
#     creating process's primary group.
#
# tree_state.json is the one file that would have survived without this:
# save_tree_state() deliberately re-applies the previous file's mode across its
# atomic replace (see app/services/tree_edit_service.py). Everything the
# pipeline writes fresh -- tree_pruned.newick/nexus, the alignments, new job
# directories -- would have come back 0644 on the next edit.
#
# Install as root, for each of dikarya-web, dikarya-worker, dikarya-metrics:
#   mkdir -p /etc/systemd/system/dikarya-web.service.d
#   cp scripts/dikarya-umask.conf /etc/systemd/system/dikarya-web.service.d/umask.conf
#   systemctl daemon-reload
#   /usr/local/sbin/restart-dikarya-web        # worker: check in-flight first
#
# Verify afterwards by submitting a job and checking that the files it wrote are
# 0664 dikarya:dikarya, not 0644.

[Service]
UMask=0002
