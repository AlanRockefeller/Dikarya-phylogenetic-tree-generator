# Memory ceiling for the second phylo_high worker. MUST be a drop-in, sorted
# after hardening.conf -- see scripts/dikarya-worker-bulk-memory.conf for why a
# value in the unit file itself is silently replaced by hardening's 8G/10G.
#
# The host has 15 GB and NO SWAP, so the three workers' hard ceilings have to be
# read together:
#   dikarya-worker        6G  (scripts/dikarya-worker-queue.conf; the copy
#                              installed before 2026-09-16 still says 8G)
#   dikarya-worker-bulk   5G
#   dikarya-worker-high2  3G  (this file)
# = 14G against 15 GB. Install the current queue.conf too if the original
# worker still reports MemoryMax=8G, or the sum is 16G.
#
# 3G is still far above what this queue needs: phylo_high only receives jobs
# under 400 records / 1 Mbp (IQ-TREE under 150 records), MAFFT peaked at
# 45-170 MB RSS across 180 benchmark runs, and the whole host never exceeded
# 33% memory across 11,433 one-minute samples (2026-09-08..16).
#
# Install as root:
#   cp scripts/dikarya-worker-high2-memory.conf \
#      /etc/systemd/system/dikarya-worker-high2.service.d/zz-memory.conf
#   systemctl daemon-reload
#
# Verify (must print 2G/3G, not 8G/10G):
#   systemctl show dikarya-worker-high2 -p MemoryHigh -p MemoryMax

[Service]
MemoryHigh=2G
MemoryMax=3G
